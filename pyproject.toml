[project]
name = "spot-albums"
version = "0.1.0"
description = "Convierte tus stats de Spotify en una wantlist de álbumes para el Snowsky Echo Mini"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
]

[project.optional-dependencies]
# Fase 3 (prep/sync al DAP): etiquetado y carátulas
library = [
    "mutagen>=1.47",
    "pillow>=11.0",
]

[project.scripts]
spot-albums = "spot_albums.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spot_albums"]

[tool.pytest.ini_options]
testpaths = ["tests"]
